<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Chamados — Visão Sul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground:   #F6F4F1;
    --surface:  #FFFFFF;
    --surface2: #EFEBE5;
    --ink:      #1B1712;
    --muted:    #726B60;
    --faint:    #A29A8C;
    --line:     #E6E0D6;
    --alert:    #C4551E;
    --alert-2:  #E58A44;
    --alert-soft: rgba(196,85,30,0.10);
    --crit:     #B0201F;
    --crit-soft: rgba(176,32,31,0.10);
    --ok:       #3D7A4E;
    --grid:     rgba(27,23,18,0.08);
    --shadow:   0 1px 2px rgba(27,23,18,.04), 0 6px 20px rgba(27,23,18,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:   #14120F;
      --surface:  #1D1A15;
      --surface2: #26221C;
      --ink:      #F1ECE3;
      --muted:    #A69C8C;
      --faint:    #766D5F;
      --line:     #322C23;
      --alert:    #F0864C;
      --alert-2:  #F5AB7A;
      --alert-soft: rgba(240,134,76,0.14);
      --crit:     #F0645F;
      --crit-soft: rgba(240,100,95,0.15);
      --ok:       #6FB884;
      --grid:     rgba(241,236,227,0.08);
      --shadow:   0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --ground:   #14120F;
    --surface:  #1D1A15;
    --surface2: #26221C;
    --ink:      #F1ECE3;
    --muted:    #A69C8C;
    --faint:    #766D5F;
    --line:     #322C23;
    --alert:    #F0864C;
    --alert-2:  #F5AB7A;
    --alert-soft: rgba(240,134,76,0.14);
    --crit:     #F0645F;
    --crit-soft: rgba(240,100,95,0.15);
    --ok:       #6FB884;
    --grid:     rgba(241,236,227,0.08);
    --shadow:   0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: clamp(20px,4vw,52px) clamp(16px,4vw,36px) 64px; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--alert);
    display: flex; align-items: center; gap: 10px; margin: 0 0 16px;
  }
  .eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--alert); display: inline-block; }
  h1 {
    font-family: "Archivo", sans-serif; font-weight: 800;
    font-size: clamp(30px,5.5vw,50px); line-height: 1.03; letter-spacing: -0.02em;
    text-wrap: balance; margin: 0 0 10px;
  }
  .lede { color: var(--muted); font-size: clamp(14px,2vw,16px); max-width: 62ch; margin: 0; }
  .lede b { color: var(--ink); font-weight: 600; }
  .lede .stamp { font-family: "IBM Plex Mono", monospace; }

  .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin: 30px 0 8px; }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2,1fr); } }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 17px 18px 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px;
  }
  .kpi .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .kpi .val { font-family: "Archivo", sans-serif; font-weight: 700; font-size: clamp(21px,3.2vw,27px); letter-spacing: -0.01em; line-height: 1.05; }
  .kpi .val.crit { color: var(--crit); }
  .kpi .val.alert { color: var(--alert); }
  .kpi .sub { font-size: 12.5px; color: var(--muted); }

  section { margin-top: 44px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 15px; flex-wrap: wrap; }
  h2 { font-family: "Archivo", sans-serif; font-weight: 700; font-size: clamp(17px,2.4vw,21px); letter-spacing: -0.01em; margin: 0; }
  .sec-note { font-size: 12.5px; color: var(--faint); font-family: "IBM Plex Mono", monospace; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(14px,3vw,24px); box-shadow: var(--shadow); }

  /* ranking de lojas */
  table { width: 100%; border-collapse: collapse; }
  .rank thead th {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); font-weight: 500; text-align: right; padding: 0 0 11px; border-bottom: 1px solid var(--line);
  }
  .rank thead th:first-child, .rank thead th:nth-child(2) { text-align: left; }
  .rank tbody td { padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  .rank tbody tr:last-child td { border-bottom: 0; }
  .rname { font-weight: 500; white-space: nowrap; padding-right: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .rpos { font-family: "IBM Plex Mono", monospace; color: var(--faint); font-size: 12px; padding-right: 10px; }
  .rbarcell { width: 34%; padding: 0 14px; }
  .rbar-track { background: var(--surface2); border-radius: 999px; height: 9px; overflow: hidden; display: flex; }
  .rbar-fill { height: 100%; background: linear-gradient(90deg, var(--alert-2), var(--alert)); }
  .rbar-crit { height: 100%; background: var(--crit); }
  td.rval { text-align: right; font-family: "IBM Plex Mono", monospace; font-weight: 500; white-space: nowrap; }
  td.rcrit { text-align: right; font-family: "IBM Plex Mono", monospace; width: 60px; }
  .badge-crit { display: inline-block; background: var(--crit-soft); color: var(--crit); border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge-zero { color: var(--faint); font-size: 12px; }

  /* criticos */
  .crit-list { display: flex; flex-direction: column; }
  .crit-item { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .crit-item:last-child { border-bottom: 0; }
  .crit-num { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--crit); font-weight: 600; white-space: nowrap; }
  .crit-body .loja { font-weight: 600; font-size: 14px; }
  .crit-body .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .crit-meta { text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--faint); white-space: nowrap; }

  /* tipo de trabalho */
  .tipo-bar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .tipo-bar .corretiva { background: var(--alert); }
  .tipo-bar .preventiva { background: var(--ok); }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  footer { margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12.5px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .msg-carregando, .msg-erro { padding: 40px 0; text-align: center; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .msg-erro { color: var(--crit); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Manutenção · Regional Sul</p>
    <h1>Chamados em aberto</h1>
    <p class="lede">Ordens de serviço da Visão Sul (ServiceNow) — todas as lojas com <b>Técnicos Próprios Sul</b>. Atualizado <span class="stamp" id="stamp">—</span>.</p>
  </header>

  <div id="conteudo">
    <div class="msg-carregando">carregando data/dados.json…</div>
  </div>
</div>

<script>
const brl0 = n => n.toLocaleString('pt-BR');
const pct = (a,b) => b ? (a/b*100).toFixed(0) + '%' : '—';

async function iniciar() {
  const el = document.getElementById('conteudo');
  let D;
  try {
    const r = await fetch('data/dados.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  } catch (e) {
    el.innerHTML = `<div class="msg-erro">Não consegui carregar os dados (${e.message}). Tente recarregar a página.</div>`;
    return;
  }

  const dt = new Date(D.atualizadoEm);
  document.getElementById('stamp').textContent = dt.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

  const taxaResolucao = pct(D.totalFechados, D.totalRegistros);
  const lojasComCritico = D.lojas.filter(l => l.criticosAbertos > 0).length;

  const kpisHtml = [
    { label: 'Chamados em aberto', val: brl0(D.totalAbertos), cls: 'alert', sub: `de ${brl0(D.totalRegistros)} no total` },
    { label: 'Críticos em aberto', val: brl0(D.totalCriticos), cls: 'crit', sub: `em ${lojasComCritico} lojas` },
    { label: 'Lojas monitoradas', val: brl0(D.totalLojas), sub: 'com técnicos próprios Sul' },
    { label: 'Taxa de resolução', val: taxaResolucao, sub: `${brl0(D.totalFechados)} encerrados` },
  ].map(k => `<div class="kpi">
      <span class="label">${k.label}</span>
      <span class="val num ${k.cls||''}">${k.val}</span>
      <span class="sub num">${k.sub}</span>
    </div>`).join('');

  const maxAbertos = Math.max(...D.lojas.map(l => l.abertos), 1);
  const top = D.lojas.slice(0, 20);
  const rankRows = top.map((l, i) => {
    const wTotal = (l.abertos / maxAbertos * 100).toFixed(1);
    const wCrit = l.abertos ? (l.criticosAbertos / l.abertos * 100).toFixed(1) : 0;
    const wResto = (100 - wCrit).toFixed(1);
    return `<tr>
      <td class="rpos">${String(i+1).padStart(2,'0')}</td>
      <td class="rname">${l.nome}</td>
      <td class="rbarcell"><div class="rbar-track" style="width:${wTotal}%">
        <div class="rbar-crit" style="width:${wCrit}%"></div><div class="rbar-fill" style="width:${wResto}%"></div>
      </div></td>
      <td class="rval num">${l.abertos}</td>
      <td class="rcrit">${l.criticosAbertos > 0 ? `<span class="badge-crit">${l.criticosAbertos} crít.</span>` : '<span class="badge-zero">—</span>'}</td>
    </tr>`;
  }).join('');

  const critHtml = D.criticosAbertos.length
    ? D.criticosAbertos.map(c => `<div class="crit-item">
        <span class="crit-num">${c.numero}</span>
        <div class="crit-body">
          <div class="loja">${c.loja}</div>
          <div class="desc">${c.descricao}${c.tecnico ? ' · ' + c.tecnico : ''}</div>
        </div>
        <span class="crit-meta">${c.aberto.split(' ')[0]}</span>
      </div>`).join('')
    : '<div class="msg-carregando">Nenhum chamado crítico em aberto.</div>';

  const totalCorretiva = D.lojas.reduce((s,l)=>s+l.corretiva,0);
  const totalPreventiva = D.lojas.reduce((s,l)=>s+l.preventiva,0);
  const totalTipo = totalCorretiva + totalPreventiva;
  const wCorr = totalTipo ? (totalCorretiva/totalTipo*100).toFixed(1) : 0;
  const wPrev = (100 - wCorr).toFixed(1);

  el.innerHTML = `
    <div class="kpis">${kpisHtml}</div>

    <section>
      <div class="sec-head">
        <h2>Lojas com mais chamados abertos</h2>
        <span class="sec-note">top 20 de ${D.totalLojas} · vermelho escuro = críticos</span>
      </div>
      <div class="card">
        <div style="overflow-x:auto">
        <table class="rank">
          <thead><tr><th></th><th>Loja</th><th></th><th>Abertos</th><th></th></tr></thead>
          <tbody>${rankRows}</tbody>
        </table>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <h2>Chamados críticos em aberto</h2>
        <span class="sec-note">${D.totalCriticos} no total · mostrando os mais antigos</span>
      </div>
      <div class="card">
        <div class="crit-list">${critHtml}</div>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>Corretiva × Preventiva</h2><span class="sec-note">${brl0(totalTipo)} chamados classificados</span></div>
      <div class="card">
        <div class="tipo-bar">
          <div class="corretiva" style="width:${wCorr}%"></div>
          <div class="preventiva" style="width:${wPrev}%"></div>
        </div>
        <div class="legend">
          <span><span class="swatch" style="background:var(--alert)"></span>Corretiva — ${brl0(totalCorretiva)} (${wCorr}%)</span>
          <span><span class="swatch" style="background:var(--ok)"></span>Preventiva — ${brl0(totalPreventiva)} (${wPrev}%)</span>
        </div>
      </div>
    </section>

    <footer>
      <span>Fonte: SOMA (ServiceNow) · Visão Sul · atualização diária automática</span>
      <span class="mono">${brl0(D.totalRegistros)} registros processados</span>
    </footer>
  `;
}
iniciar();
</script>
</body>
</html>
